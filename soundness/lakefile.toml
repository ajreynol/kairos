name = "KairosSoundness"
version = "0.1.0"
defaultTargets = ["KairosSoundness"]

# The last link: Kairos's refinement theorem with Logos's soundness theorem.
# This needs Logos's verification project, so Mathlib and Logos's own proofs,
# which take hours to build. CI does not build this project; build it by hand
# (see README.md).
[[require]]
name = "KairosVerification"
path = "../verification"

# Logos's verification project, at the revision Kairos pins (lakefile.toml at
# the root); keep the two revisions equal.
[[require]]
name = "LogosVerification"
git = "https://github.com/cvc5/logos"
rev = "bdcbd95f615627b26b6ebabc0f584e5230b0bf1f"
subDir = "verification"

[[lean_lib]]
name = "KairosSoundness"
