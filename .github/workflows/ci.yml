name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Compiles Logos's cached CPC signature with Logos's ethos-eoc and with
  # kairos-eoc, and fails if Logos's committed Cpc/ and CpcMini/ are not what
  # its own pipeline produces, or if Kairos/Gen/ is not what kairos-eoc
  # produces. Nothing from cvc5 is fetched.
  regeneration:
    name: regeneration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install the GMP development headers
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgmp-dev

      # Keyed on the Logos pin, which fixes the Ethos commit; kairos-eoc is
      # rebuilt every time, since its sources live here.
      - name: Restore Logos and its Eunoia compiler
        uses: actions/cache@v4
        with:
          path: install/deps
          key: eoc-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'install/get-eo-compiler.sh') }}

      - name: Build the Eunoia compiler and kairos-eoc
        run: |
          if [ -x install/deps/eoc/ethos/build-eoc/ethos-eoc ]; then
            bash install/get-eo-compiler.sh --skip-ethos --werror
          else
            bash install/get-eo-compiler.sh --werror
          fi

      - name: Check the generated Kairos against the cached signature
        run: bash install/install-cpc.sh --check

      - name: Check the forked files against the pinned Ethos
        run: bash scripts/fork-drift.sh

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build Kairos and its proofs
        run: lake build
