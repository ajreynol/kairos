name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev cmake

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Ethos build
        uses: actions/cache@v4
        with:
          path: deps/eoc
          key: eoc-${{ hashFiles('lake-manifest.json') }}

      - name: Fetch Logos and build ethos-eoc + kairos-eoc
        run: |
          if [ -x deps/eoc/ethos/build-eoc/ethos-eoc ]; then
            scripts/get-deps.sh --skip-ethos --werror
          else
            scripts/get-deps.sh --werror
          fi

      - name: Kairos/Gen/ is what the pinned Logos generates
        run: scripts/generate.sh --check

      - name: Fork base matches the pinned Ethos
        run: scripts/fork-drift.sh

      - name: Build Kairos
        run: lake build
