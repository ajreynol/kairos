name = "Kairos"
version = "0.1.0"
defaultTargets = ["Kairos", "KairosTest"]

# Logos, the verified CPC checker Kairos is proven to refine. This pin is the
# single source of truth for the CPC signature (install/defs/Cpc.cached.eo)
# and, through Logos's install/get-eo-compiler.sh, for the Ethos commit whose
# ethos-eoc compiles it. Move it only together with a regeneration
# (install/install-cpc.sh) so that Kairos/Gen/ stays in step.
[[require]]
name = "Cpc"
git = "https://github.com/cvc5/logos"
rev = "4b25707331d5408c0b2597c942ddce892c1f7f3b"

[[lean_lib]]
name = "Kairos"
# maxHeartbeats on the command line: Lean generates the equation lemmas of
# Logos's (imported) definitions with the command line's options, not the
# file's, and those of __eo_typeof need more than the default.
moreLeanArgs = ["-DwarningAsError=true", "-DmaxHeartbeats=20000000"]

[[lean_lib]]
name = "KairosTest"
roots = ["Kairos.Checker.Test"]

