name = "Kairos"
version = "0.1.0"
defaultTargets = ["Kairos", "KairosProto"]

# Logos, the verified CPC checker Kairos is proven to refine. This pin is the
# single source of truth for the CPC signature (install/defs/Cpc.cached.eo)
# and, through Logos's install/get-eo-compiler.sh, for the Ethos commit whose
# ethos-eoc compiles it. Move it only together with a regeneration
# (scripts/generate.sh) so that Kairos/Gen/ stays in step.
[[require]]
name = "Cpc"
git = "https://github.com/cvc5/logos"
rev = "4b25707331d5408c0b2597c942ddce892c1f7f3b"

[[lean_lib]]
name = "Kairos"
moreLeanArgs = ["-DwarningAsError=true"]

[[lean_lib]]
name = "KairosProto"
roots = ["Kairos.Proto.Core", "Kairos.Proto.Monad", "Kairos.Proto.Mini"]

[[lean_exe]]
name = "kairos-proto-bench"
root = "Kairos.Proto.Bench"
